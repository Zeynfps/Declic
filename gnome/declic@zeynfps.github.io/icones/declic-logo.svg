<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Logo sombre : carré graphite, traits gris clair (ancienne version corail : ressources/declic-logo-corail.svg) -->
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3a3f"/>
      <stop offset="1" stop-color="#232327"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#fond)" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.5"/>
  <!-- rayons du « déclic » -->
  <g stroke="#d4d4d8" stroke-width="3.6" stroke-linecap="round" opacity="0.75">
    <line x1="22" y1="12" x2="22" y2="18"/>
    <line x1="11" y1="22" x2="17" y2="22"/>
    <line x1="13.5" y1="13.5" x2="17.5" y2="17.5"/>
  </g>
  <!-- pointeur -->
  <path d="M25 24 L48 33 L38.5 36.5 L44.5 46 L39.5 49 L33.5 39.5 L27 46 Z"
        fill="#e4e4e7" stroke="#e4e4e7" stroke-width="2" stroke-linejoin="round"/>
</svg>
