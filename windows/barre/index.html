<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:">
  <title>Déclic</title>
  <link rel="stylesheet" href="barre.css">
</head>
<body>
  <!-- Réfraction du verre (Liquid Glass) : sur les bords, l'image derrière la barre est déviée vers l'intérieur.
       La carte de déviation est dessinée par verre.js à la taille de la barre. -->
  <svg class="filtres" aria-hidden="true" width="0" height="0">
    <filter id="lentille" x="0" y="0" width="100%" height="100%" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feImage id="carte-lentille" x="0" y="0" result="carte" preserveAspectRatio="none"/>
      <feDisplacementMap in="SourceGraphic" in2="carte" scale="34" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>
  <div class="barre" id="barre" role="dialog" aria-label="Déclic">
      <div class="verre" id="verre" aria-hidden="true"></div>
      <div class="saisie">
        <button class="bouton-rond" id="retour" hidden title="Revenir (Échap)" aria-label="Revenir"></button>
        <span class="puce" id="puce" hidden></span>
        <input class="entree" id="entree" type="text" autocomplete="off" spellcheck="false" aria-label="Rechercher">
        <button class="bouton-rond" id="ajout" title="Ajouter (Ctrl+N)" aria-label="Ajouter"></button>
      </div>
      <div class="corps">
        <div class="liste" id="liste" role="listbox" aria-label="Résultats"></div>
        <div class="vide" id="vide" hidden>
          <span id="vide-icone"></span>
          <span class="vide-texte" id="vide-texte"></span>
        </div>
      </div>
      <div class="pied">
        <button class="pied-logo" id="logo" title="Réglages de Déclic (Ctrl+,)" aria-label="Réglages">
          <img src="../icones/declic-logo.svg" width="18" height="18" alt="">
        </button>
        <span class="pied-icone" id="pied-icone" hidden></span>
        <span class="pied-texte" id="pied-texte">Déclic</span>
        <button class="pied-bouton" id="principal"><span id="principal-texte"></span><kbd>↵</kbd></button>
        <span class="pied-separateur"></span>
        <button class="pied-bouton" id="bouton-actions">Actions<kbd>Ctrl</kbd><kbd>K</kbd></button>
      </div>
      <div class="actions" id="actions" hidden role="menu"></div>
  </div>
  <script src="verre.js"></script>
  <script src="icones.js"></script>
  <script src="barre.js"></script>
</body>
</html>
