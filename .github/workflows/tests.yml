name: Tests

on:
  push:
  pull_request:

jobs:
  coeur:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Tests du cœur
        working-directory: coeur
        run: python -m unittest -v
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntaxe de l'extension
        run: for f in gnome/*/*.js; do node --check "$f"; done
